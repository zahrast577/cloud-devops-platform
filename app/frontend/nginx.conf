server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonde de santé du frontend (compose, puis Kubernetes)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Tout ce qui commence par /api est envoyé à l'API.
    # "api" est le nom du service : dans docker-compose comme dans Kubernetes,
    # le DNS interne le résout vers l'API. Il faudra donc nommer le Service "api".
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Application React : toute autre URL renvoie index.html
    location / {
        try_files $uri /index.html;
    }
}
