
name: Safety Dependency Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  safety-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Safety
        run: python -m pip install safety

      - name: Scan Python dependencies
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: python -m safety scan -r app/api/requirements.txt
