
name: DevSecOps Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit
        run: bandit -r app/api -ll

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Run Checkov
        run: checkov --directory infra/terraform --framework terraform --soft-fail
  
  trivy-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t items-api:ci ./app/api

      - name: Build frontend image
        run: docker build -t items-frontend:ci ./app/frontend

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: items-api:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: items-frontend:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
